<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown+ 编辑器 — 界面原型</title>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: var(--font-sans);
      background-color: var(--color-bg);
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header-frame {
      height: 34px;
      flex-shrink: 0;
      width: 100%;
      border: none;
      display: block;
    }

    .main-content {
      flex: 1;
      min-height: 0;
      display: flex;
    }

    .sidebar-frame {
      width: 220px;
      flex-shrink: 0;
      height: 100%;
      border: none;
      display: block;
      transition: width 0.2s ease;
    }
    .sidebar-frame.collapsed { width: 48px; }

    .editor-frame {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: none;
      display: block;
    }

    .statusbar-frame {
      height: 32px;
      flex-shrink: 0;
      width: 100%;
      border: none;
      display: block;
    }

    iframe { background-color: transparent; }

    /* ===== 菜单下拉（顶层渲染，可超出 iframe） ===== */
    .menu-dropdown {
      position: fixed;
      z-index: 10002;
      min-width: 220px;
      padding: 5px;
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: none;
      animation: menu-in 0.12s ease;
    }
    .menu-dropdown.visible { display: block; }
    @keyframes menu-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .menu-entry {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; padding: 7px 12px;
      font-size: 13px; color: var(--color-text);
      border-radius: var(--radius-md);
      cursor: pointer; white-space: nowrap; position: relative;
      transition: background var(--transition-fast);
    }
    .menu-entry:hover { background-color: var(--color-bg-secondary); }
    .menu-entry .shortcut { font-size: 12px; color: var(--color-text-tertiary); font-family: var(--font-mono); }
    .menu-entry .sub-indicator { font-size: 10px; color: var(--color-text-tertiary); }
    .menu-divider { height: 1px; margin: 5px 8px; background-color: var(--color-border); }
    .menu-entry .check { width: 14px; display: inline-block; text-align: center; color: var(--color-primary); font-weight: 600; }

    .submenu {
      position: absolute; left: calc(100% - 4px); top: -6px;
      min-width: 180px; padding: 5px;
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: none; z-index: 10003;
    }
    .menu-entry.has-sub:hover > .submenu { display: block; }

    /* ===== 浮层（对话框） ===== */
    .overlay {
      position: fixed; inset: 0; z-index: 10000;
      display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.4);
    }
    .overlay.visible { display: flex; }

    .dialog {
      width: 400px; max-width: 90vw; max-height: 84vh; overflow-y: auto;
      padding: 24px;
      background: var(--color-bg-primary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      animation: dialog-in 0.16s ease;
    }
    @keyframes dialog-in {
      from { opacity: 0; transform: scale(0.96) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .dialog-title { margin: 0 0 16px; font-size: 16px; font-weight: 600; color: var(--color-text); }
    .dialog-body { font-size: 13px; color: var(--color-text-secondary); line-height: 1.7; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .dialog-btn { padding: 7px 18px; font-size: 13px; border: none; border-radius: var(--radius-md); cursor: pointer; transition: all var(--transition-fast); font-weight: 500; }
    .dialog-btn-primary { color: #fff; background: var(--color-primary); }
    .dialog-btn-primary:hover { background: var(--color-primary-hover); }

    .about-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .about-logo { width: 64px; height: 64px; border-radius: var(--radius-xl); box-shadow: var(--shadow-md); margin-bottom: 14px; }
    .about-name { font-size: 18px; font-weight: 700; color: var(--color-text); }
    .about-version { font-size: 13px; color: var(--color-text-tertiary); margin: 4px 0 16px; }
    .about-copy { font-size: 12px; color: var(--color-text-tertiary); line-height: 1.7; }

    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; }
    .setting-label { font-size: 13px; color: var(--color-text); }
    .setting-desc { font-size: 12px; color: var(--color-text-tertiary); margin-top: 2px; }
    .setting-divider { height: 1px; background: var(--color-border); margin: 2px 0; }
    .switch { position: relative; width: 36px; height: 20px; cursor: pointer; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; border-radius: 10px; background: var(--color-bg-tertiary); transition: background 0.2s; }
    .switch .slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: white; border-radius: 50%; transition: transform 0.2s; }
    .switch input:checked + .slider { background: var(--color-primary); }
    .switch input:checked + .slider::before { transform: translateX(16px); }
    input[type="range"] { -webkit-appearance: none; width: 130px; height: 4px; border-radius: 2px; background: var(--color-bg-tertiary); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--color-primary); cursor: pointer; }
    .range-value { font-size: 12px; color: var(--color-text-secondary); min-width: 30px; text-align: right; }
    .theme-option { display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin: 4px 0; border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; font-size: 13px; color: var(--color-text); transition: all var(--transition-fast); }
    .theme-option:hover { border-color: var(--color-primary); }
    .theme-option.active { border-color: var(--color-primary); background: var(--color-primary-soft); color: var(--color-primary); }

    .shortcuts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 28px; }
    .shortcut-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
    .shortcut-item kbd { display: inline-flex; align-items: center; padding: 3px 9px; font-family: var(--font-mono); font-size: 11px; background: var(--color-bg-secondary); border: 1px solid var(--color-border); border-bottom-width: 2px; border-radius: 5px; color: var(--color-text-secondary); white-space: nowrap; }
    .shortcut-item span { font-size: 13px; color: var(--color-text-secondary); }

    /* ===== Toast ===== */
    .toast {
      position: fixed; bottom: 52px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      padding: 9px 20px;
      background: var(--color-text);
      color: var(--color-bg-primary);
      font-size: 13px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 10001;
    }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    [data-theme='dark'] .toast { background: #e5e7eb; color: #1f2937; }
  </style>
</head>
<body>
  <div class="app">
    <iframe class="header-frame" id="header-frame" src="components/app-header.html" title="标题栏"></iframe>

    <div class="main-content">
      <iframe class="sidebar-frame" id="sidebar-frame" src="components/sidebar.html" title="侧边栏"></iframe>
      <iframe class="editor-frame" id="editor-frame" src="components/editor.html" title="编辑器"></iframe>
    </div>

    <iframe class="statusbar-frame" id="statusbar-frame" src="components/status-bar.html" title="状态栏"></iframe>
  </div>

  <!-- 菜单下拉 -->
  <div class="menu-dropdown" id="menu-dropdown"></div>

  <!-- 关于对话框 -->
  <div class="overlay" id="about-overlay">
    <div class="dialog">
      <div class="about-box">
        <img src="assets/logo.svg" alt="M+" class="about-logo">
        <div class="about-name">Markdown+</div>
        <div class="about-version">版本 1.0.0</div>
        <div class="about-copy">Copyright © 2026 Markdown+ Team<br>一款自包含 .mdx 文件格式的轻量级 Markdown 编辑器。</div>
      </div>
      <div class="dialog-actions">
        <button class="dialog-btn dialog-btn-primary" data-close="about-overlay">确定</button>
      </div>
    </div>
  </div>

  <!-- 设置对话框 -->
  <div class="overlay" id="settings-overlay">
    <div class="dialog">
      <h3 class="dialog-title">设置</h3>
      <div class="dialog-body">
        <div class="setting-row">
          <div><div class="setting-label">图片自动压缩</div><div class="setting-desc">插入图片时自动压缩以减小文档体积</div></div>
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
        </div>
        <div class="setting-divider"></div>
        <div class="setting-row">
          <div><div class="setting-label">压缩质量</div><div class="setting-desc">数值越高画质越好、体积越大</div></div>
          <div style="display:flex;align-items:center;gap:8px;">
            <input type="range" min="1" max="100" value="85" id="quality-range">
            <span class="range-value" id="quality-value">85</span>
          </div>
        </div>
        <div class="setting-divider"></div>
        <div style="padding-top:8px;">
          <div class="setting-label" style="margin-bottom:8px;">默认主题</div>
          <div class="theme-option active" data-theme-opt="light">浅色</div>
          <div class="theme-option" data-theme-opt="dark">深色</div>
          <div class="theme-option" data-theme-opt="system">跟随系统</div>
        </div>
      </div>
      <div class="dialog-actions">
        <button class="dialog-btn dialog-btn-primary" data-close="settings-overlay">完成</button>
      </div>
    </div>
  </div>

  <!-- 快捷键对话框 -->
  <div class="overlay" id="shortcuts-overlay">
    <div class="dialog">
      <h3 class="dialog-title">快捷键</h3>
      <div class="shortcuts-grid">
        <div class="shortcut-item"><kbd>Ctrl+N</kbd><span>新建文件</span></div>
        <div class="shortcut-item"><kbd>Ctrl+O</kbd><span>打开文件</span></div>
        <div class="shortcut-item"><kbd>Ctrl+S</kbd><span>保存文件</span></div>
        <div class="shortcut-item"><kbd>Ctrl+Shift+S</kbd><span>另存为</span></div>
        <div class="shortcut-item"><kbd>Ctrl+B</kbd><span>粗体</span></div>
        <div class="shortcut-item"><kbd>Ctrl+I</kbd><span>斜体</span></div>
        <div class="shortcut-item"><kbd>Ctrl+K</kbd><span>插入链接</span></div>
        <div class="shortcut-item"><kbd>Ctrl+H</kbd><span>切换标题</span></div>
        <div class="shortcut-item"><kbd>Ctrl+F</kbd><span>查找</span></div>
        <div class="shortcut-item"><kbd>Ctrl+/</kbd><span>注释</span></div>
        <div class="shortcut-item"><kbd>Ctrl+Z</kbd><span>撤销</span></div>
        <div class="shortcut-item"><kbd>Ctrl+Y</kbd><span>重做</span></div>
      </div>
      <div class="dialog-actions">
        <button class="dialog-btn dialog-btn-primary" data-close="shortcuts-overlay">确定</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      var frames = {
        header: document.getElementById('header-frame'),
        sidebar: document.getElementById('sidebar-frame'),
        editor: document.getElementById('editor-frame'),
        statusbar: document.getElementById('statusbar-frame')
      };
      var allFrames = [frames.header, frames.sidebar, frames.editor, frames.statusbar];

      // ===== 状态 =====
      var currentMode = 'ir';
      var currentTheme = 'light';
      var openMenu = null;

      function applyTheme(theme) {
        currentTheme = theme;
        document.documentElement.setAttribute('data-theme', theme);
      }
      function systemTheme() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      var toastTimer = null;
      function showToast(message) {
        var toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('visible');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('visible'); }, 1800);
      }

      // ===== 菜单数据 =====
      function item(label, action, shortcut) { return { t: 'item', label: label, action: action, shortcut: shortcut }; }
      function sub(label, entries) { return { t: 'sub', label: label, entries: entries }; }
      function div() { return { t: 'divider' }; }

      var MENUS = {
        file: [
          item('新建文件', 'new-file', 'Ctrl+N'),
          item('打开文件...', 'open-file', 'Ctrl+O'),
          item('打开文件夹...', 'open-folder'),
          div(),
          item('保存', 'save', 'Ctrl+S'),
          item('另存为...', 'save-as', 'Ctrl+Shift+S'),
          div(),
          item('导入 Markdown...', 'import-md'),
          item('导入文件夹...', 'import-folder'),
          div(),
          item('导出为 Markdown...', 'export-md'),
          item('导出为 PDF...', 'export-pdf'),
          item('批量导出 PDF...', 'export-batch-pdf'),
          div(),
          sub('最近文件', [item('示例文档.mdx', 'recent'), item('项目说明.mdx', 'recent'), item('会议纪要.mdx', 'recent')]),
          div(),
          item('退出', 'exit')
        ],
        edit: [
          item('撤销', 'undo', 'Ctrl+Z'),
          item('重做', 'redo', 'Ctrl+Y'),
          div(),
          item('剪切', 'cut', 'Ctrl+X'),
          item('复制', 'copy', 'Ctrl+C'),
          item('粘贴', 'paste', 'Ctrl+V'),
          div(),
          item('查找', 'find', 'Ctrl+F'),
          item('替换', 'replace', 'Ctrl+H')
        ],
        view: [
          sub('编辑器模式', [item('即时渲染', 'mode-ir'), item('源码编辑', 'mode-source'), item('分屏预览', 'mode-split')]),
          sub('主题', [item('浅色', 'theme-light'), item('深色', 'theme-dark'), item('跟随系统', 'theme-system')]),
          div(),
          item('显示/隐藏侧边栏', 'toggle-sidebar', 'Ctrl+B'),
          div(),
          item('设置...', 'settings', 'Ctrl+,')
        ],
        insert: [
          item('图片...', 'insert-image', 'Ctrl+Shift+K'),
          item('链接...', 'insert-link', 'Ctrl+K'),
          div(),
          item('表格', 'insert-table'),
          item('代码块', 'insert-code'),
          item('分割线', 'insert-hr'),
          div(),
          item('附件...', 'insert-attachment')
        ],
        help: [
          item('快捷键速查', 'shortcuts', 'Ctrl+/'),
          item('使用文档', 'docs'),
          div(),
          item('关于 Markdown+', 'about')
        ]
      };

      var MODE_LABELS = { 'mode-ir': '即时渲染', 'mode-source': '源码编辑', 'mode-split': '分屏预览' };
      var THEME_LABELS = { 'theme-light': '浅色', 'theme-dark': '深色', 'theme-system': '跟随系统' };

      // ===== 菜单渲染 =====
      var dropdownEl = document.getElementById('menu-dropdown');

      function isChecked(entry) {
        if (entry.action === 'mode-ir' || entry.action === 'mode-source' || entry.action === 'mode-split') {
          return currentMode === entry.action.replace('mode-', '');
        }
        if (entry.action === 'theme-light' || entry.action === 'theme-dark') {
          return currentTheme === entry.action.replace('theme-', '');
        }
        if (entry.action === 'theme-system') return false;
        return false;
      }

      function renderEntries(entries) {
        return entries.map(function (e) {
          if (e.t === 'divider') return '<div class="menu-divider"></div>';
          if (e.t === 'sub') {
            var inner = '<div class="submenu">' + e.entries.map(function (s) {
              var check = isChecked(s) ? '<span class="check">✓</span>' : '<span class="check"></span>';
              return '<div class="menu-entry" data-action="' + s.action + '">' + check + '<span>' + s.label + '</span></div>';
            }).join('') + '</div>';
            return '<div class="menu-entry has-sub"><span>' + e.label + '</span><span class="sub-indicator">▸</span>' + inner + '</div>';
          }
          var shortcut = e.shortcut ? '<span class="shortcut">' + e.shortcut + '</span>' : '';
          return '<div class="menu-entry" data-action="' + e.action + '"><span>' + e.label + '</span>' + shortcut + '</div>';
        }).join('');
      }

      function openMenuAt(name, left, top) {
        if (openMenu === name) { closeMenu(); return; }
        var entries = MENUS[name];
        if (!entries) return;
        openMenu = name;
        dropdownEl.innerHTML = renderEntries(entries);
        dropdownEl.style.left = left + 'px';
        dropdownEl.style.top = top + 'px';
        dropdownEl.classList.add('visible');
        bindMenuEvents();
        notifyHeader(true);
      }

      function closeMenu() {
        openMenu = null;
        dropdownEl.classList.remove('visible');
        dropdownEl.innerHTML = '';
        notifyHeader(false);
      }

      function notifyHeader(open) {
        frames.header.contentWindow && frames.header.contentWindow.postMessage({ type: 'menu-state', open: open }, '*');
      }

      function bindMenuEvents() {
        dropdownEl.querySelectorAll('.menu-entry[data-action]').forEach(function (entry) {
          entry.addEventListener('click', function (e) {
            e.stopPropagation();
            var action = entry.getAttribute('data-action');
            closeMenu();
            handleAction(action);
          });
        });
      }

      // ===== 动作分发 =====
      var TOAST_LABELS = {
        'new-file': '新建文件', 'open-file': '打开文件', 'open-folder': '打开文件夹',
        'save': '保存', 'save-as': '另存为', 'import-md': '导入 Markdown', 'import-folder': '导入文件夹',
        'export-md': '导出 Markdown', 'export-pdf': '导出 PDF', 'export-batch-pdf': '批量导出 PDF',
        'recent': '打开最近文件', 'exit': '退出',
        'undo': '撤销', 'redo': '重做', 'cut': '剪切', 'copy': '复制', 'paste': '粘贴',
        'find': '查找', 'replace': '替换',
        'insert-image': '插入图片', 'insert-link': '插入链接', 'insert-table': '插入表格',
        'insert-code': '插入代码块', 'insert-hr': '插入分割线', 'insert-attachment': '插入附件',
        'docs': '使用文档'
      };

      function broadcastTheme(theme) {
        applyTheme(theme);
        allFrames.forEach(function (f) {
          f.contentWindow && f.contentWindow.postMessage({ type: 'theme', theme: theme }, '*');
        });
      }
      function broadcastMode(mode) {
        currentMode = mode;
        [frames.editor, frames.statusbar].forEach(function (f) {
          f.contentWindow && f.contentWindow.postMessage({ type: 'mode', mode: mode }, '*');
        });
      }

      function handleAction(action) {
        if (action === 'about') { document.getElementById('about-overlay').classList.add('visible'); return; }
        if (action === 'settings') { document.getElementById('settings-overlay').classList.add('visible'); return; }
        if (action === 'shortcuts') { document.getElementById('shortcuts-overlay').classList.add('visible'); return; }
        if (action === 'mode-ir' || action === 'mode-source' || action === 'mode-split') {
          broadcastMode(action.replace('mode-', ''));
          return;
        }
        if (action === 'theme-light' || action === 'theme-dark') {
          broadcastTheme(action.replace('theme-', ''));
          return;
        }
        if (action === 'theme-system') {
          broadcastTheme(systemTheme());
          return;
        }
        if (action === 'toggle-sidebar') {
          frames.sidebar.classList.toggle('collapsed');
          var collapsed = frames.sidebar.classList.contains('collapsed');
          frames.sidebar.contentWindow && frames.sidebar.contentWindow.postMessage({ type: 'sidebar', collapsed: collapsed }, '*');
          return;
        }
        var label = TOAST_LABELS[action] || '操作';
        showToast(label + '（原型未实现）');
      }

      // ===== 监听子组件消息 =====
      window.addEventListener('message', function (event) {
        var msg = event.data;
        if (!msg || typeof msg !== 'object' || !msg.type) return;

        if (msg.type === 'theme') {
          broadcastTheme(msg.theme);
        } else if (msg.type === 'mode') {
          broadcastMode(msg.mode);
        } else if (msg.type === 'sidebar') {
          frames.sidebar.classList.toggle('collapsed', !!msg.collapsed);
        } else if (msg.type === 'menu-open') {
          openMenuAt(msg.menu, msg.left, msg.top);
        } else if (msg.type === 'menu-hover') {
          if (openMenu && openMenu !== msg.menu) openMenuAt(msg.menu, msg.left, msg.top);
        }
      });

      // 点击外部 / Esc 关闭菜单
      document.addEventListener('mousedown', function (e) {
        if (openMenu && !dropdownEl.contains(e.target)) closeMenu();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && openMenu) closeMenu();
      });

      // ===== 对话框 =====
      document.querySelectorAll('[data-close]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.getElementById(btn.getAttribute('data-close')).classList.remove('visible');
        });
      });
      document.querySelectorAll('.overlay').forEach(function (ov) {
        ov.addEventListener('click', function (e) {
          if (e.target === ov) ov.classList.remove('visible');
        });
      });

      var range = document.getElementById('quality-range');
      var rangeVal = document.getElementById('quality-value');
      range.addEventListener('input', function () { rangeVal.textContent = range.value; });

      document.querySelectorAll('[data-theme-opt]').forEach(function (opt) {
        opt.addEventListener('click', function () {
          var value = opt.getAttribute('data-theme-opt');
          var theme = value === 'system' ? systemTheme() : value;
          document.querySelectorAll('[data-theme-opt]').forEach(function (o) { o.classList.remove('active'); });
          opt.classList.add('active');
          broadcastTheme(theme);
        });
      });
    })();
  </script>
</body>
</html>
