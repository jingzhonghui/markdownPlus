appId: com.markdown-plus.app
productName: MackdownPlus
copyright: Copyright © 2026 Markdown+ Team
directories:
  output: dist
  buildResources: build
electronLanguages:
  - en-US
  - zh-CN
files:
  - '**/*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/*.d.ts'
  - '!**/node_modules/.bin'
  - '!**/*.map'
  - '!**/node_modules/pdfjs-dist/**'
  - '!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}'
  - '!.editorconfig'
  - '!**/._*'
  - '!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}'
  - '!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}'
  - '!**/{appveyor.yml,.travis.yml,circle.yml}'
  - '!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}'
asar: true
afterPack: build/after-pack.cjs
extraResources:
  - from: resources/Markdown+ 使用教程.pdf
    to: user-guide/Markdown+ 使用教程.pdf
  - from: resources/rg
    to: rg
    filter:
      - '**/*'
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  include: build/windows-shell.nsh
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Office
  maintainer: Markdown+ Team
# 自动更新发布源配置（GitHub Releases）
publish:
  provider: github
  owner: jingzhonghui
  repo: markdownPlus
