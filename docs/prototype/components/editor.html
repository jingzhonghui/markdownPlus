<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor</title>
  <link rel="stylesheet" href="../css/theme.css">
  <style>
    body { overflow: hidden; }

    .editor-panel {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--color-bg-primary);
    }

    /* ===== TabBar ===== */
    .tab-bar {
      display: flex;
      align-items: stretch;
      height: 36px;
      background-color: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border);
      overflow-x: auto;
      overflow-y: hidden;
      flex-shrink: 0;
      scrollbar-width: thin;
    }

    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      min-width: 0;
      max-width: 200px;
      border-right: 1px solid var(--color-border);
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      font-size: 13px;
      color: var(--color-text-secondary);
      transition: background-color 0.15s, color 0.15s;
      user-select: none;
    }

    .tab:hover { background-color: var(--color-bg-tertiary); color: var(--color-text); }
    .tab.active { background-color: var(--color-bg-primary); color: var(--color-text); }
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 8px; right: 8px;
      height: 2px;
      background-color: var(--color-primary);
      border-radius: 1px;
    }

    .tab-icon { width: 14px; height: 14px; flex-shrink: 0; color: var(--color-text-secondary); }
    .tab.active .tab-icon { color: var(--color-primary); }

    .tab-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .tab-modified-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background-color: var(--color-warning);
      flex-shrink: 0;
    }

    .tab-close-btn {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: transparent;
      color: var(--color-text-secondary);
      border-radius: 3px; cursor: pointer; flex-shrink: 0;
      opacity: 0; transition: opacity 0.15s, background-color 0.15s, color 0.15s;
      padding: 0;
    }
    .tab:hover .tab-close-btn { opacity: 1; }
    .tab-close-btn:hover { background-color: rgba(128, 128, 128, 0.2); color: var(--color-text); }
    .tab-close-btn svg { width: 12px; height: 12px; }

    /* ===== 编辑器区域 ===== */
    .editor-area {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      display: flex;
    }

    /* IR 编辑器 */
    .ir-panel {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px 64px;
      max-width: 760px;
      margin: 0 auto;
      width: 100%;
    }

    .ir-content { line-height: 1.75; font-size: 16px; color: var(--color-text); }

    .ir-content h1 {
      font-size: 1.75em; border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.35em; margin: 0.8em 0 0.5em; font-weight: 700;
      padding-left: 0.2em; letter-spacing: -0.01em;
    }
    .ir-content h2 {
      font-size: 1.4em; border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.3em; margin: 1.1em 0 0.5em; font-weight: 600;
      padding-left: 0.4em;
    }
    .ir-content h3 { font-size: 1.18em; margin: 1.1em 0 0.4em; font-weight: 600; padding-left: 0.6em; }
    .ir-content p { margin: 0.5em 0; }

    /* 块级标记 */
    .ir-content h1::before { content: '# '; }
    .ir-content h2::before { content: '## '; }
    .ir-content h3::before { content: '### '; }
    .ir-content h1::before, .ir-content h2::before, .ir-content h3::before {
      opacity: 0.4; font-family: var(--font-mono); font-size: 0.85em; font-weight: 400;
      user-select: none; pointer-events: none;
    }

    /* 列表标记 */
    .ir-content ul { list-style: none; padding-left: 1.5em; margin: 0.5em 0; }
    .ir-content ul > li { position: relative; margin: 0.25em 0; }
    .ir-content ul > li::before {
      content: '- ';
      position: absolute; left: -1.2em;
      opacity: 0.4; font-family: var(--font-mono); font-size: 0.85em;
      user-select: none; pointer-events: none;
    }
    .ir-content ul.task-list { list-style: none; padding-left: 0; }
    .ir-content ul.task-list > li {
      display: flex; align-items: flex-start; gap: 8px;
    }
    .ir-content ul.task-list > li::before { content: none; }
    .ir-content ul.task-list input[type="checkbox"] { margin-top: 0.3em; cursor: pointer; }
    .ir-content ul.task-list > li.checked { color: var(--color-text-secondary); text-decoration: line-through; }

    /* 引用 */
    .ir-content blockquote {
      border-left: 3px solid var(--color-primary);
      padding: 10px 16px; margin: 0.75em 0;
      background: var(--color-primary-soft);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      color: var(--color-text-secondary);
    }
    .ir-content blockquote::before { content: '> '; display: inline; opacity: 0.4; font-family: var(--font-mono); font-size: 0.85em; }

    /* 代码块 */
    .ir-content pre {
      background: var(--color-bg-secondary);
      padding: 2.2em 18px 1.6em;
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: 0.88em; overflow-x: auto; margin: 0.75em 0;
      position: relative;
      border: 1px solid var(--color-border);
    }
    .ir-content pre::before {
      content: '```' attr(data-lang);
      display: block; position: absolute;
      top: 0; left: 0; right: 0; padding: 2px 12px;
      font-size: 0.8em; opacity: 0.4;
      user-select: none; pointer-events: none; white-space: pre;
    }
    .ir-content pre::after {
      content: '```';
      display: block; position: absolute;
      bottom: 0; left: 0; right: 0; padding: 2px 12px;
      font-size: 0.8em; opacity: 0.4;
      user-select: none; pointer-events: none;
    }

    .ir-content code {
      background: var(--color-bg-secondary);
      padding: 2px 6px; border-radius: 3px;
      font-size: 0.9em; font-family: var(--font-mono);
    }
    .ir-content pre code { background: none; padding: 0; display: block; white-space: pre-wrap; }

    /* 行内标记 */
    .md-mark::before, .md-mark::after { opacity: 0.4; font-family: var(--font-mono); user-select: none; pointer-events: none; }
    .md-bold::before { content: '**'; } .md-bold::after { content: '**'; }
    .md-italic::before { content: '*'; } .md-italic::after { content: '*'; }
    .md-code::before { content: '`'; } .md-code::after { content: '`'; }

    .ir-content a { color: var(--color-primary); text-decoration: underline; }
    .ir-content hr { border: none; border-top: 2px solid var(--color-border); margin: 1.5em 0; }
    .ir-content img { max-width: 100%; height: auto; border-radius: 4px; cursor: pointer; }

    /* 表格 */
    .ir-content table { border-collapse: collapse; width: 100%; margin: 0.75em 0; font-size: 0.95em; }
    .ir-content th, .ir-content td { border: 1px solid var(--color-border); padding: 9px 14px; min-width: 60px; }
    .ir-content th { background: var(--color-bg-secondary); font-weight: 600; text-align: left; }
    .ir-content td { color: var(--color-text); }

    /* 源码编辑器 */
    .source-panel {
      flex: 1;
      overflow: auto;
      background-color: var(--color-bg-primary);
    }
    .source-code {
      display: flex;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.6;
      padding: 16px 0;
    }
    .line-numbers {
      text-align: right;
      padding: 0 12px 0 16px;
      color: var(--color-text-tertiary);
      user-select: none;
      flex-shrink: 0;
    }
    .line-numbers div { height: 22.4px; }
    .code-text {
      flex: 1;
      white-space: pre;
      color: var(--color-text);
      padding-right: 16px;
    }
    .code-text .md-h { color: var(--color-primary); }
    .code-text .md-bold { color: var(--color-text); font-weight: 700; }

    /* 分屏：源码 + 预览 */
    .split-layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .split-source {
      flex: 1;
      min-width: 0;
      overflow: auto;
      border-right: 1px solid var(--color-border);
      background: var(--color-bg-primary);
    }
    .split-preview {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      background: var(--color-bg-primary);
    }
    .preview-content { padding: 32px 40px 64px; max-width: 760px; margin: 0 auto; line-height: 1.7; }

    /* 预览样式 */
    .preview-content h1 { font-size: 1.75em; border-bottom: 1px solid var(--color-border); padding-bottom: 0.35em; margin: 0.8em 0 0.5em; }
    .preview-content h2 { font-size: 1.4em; border-bottom: 1px solid var(--color-border); padding-bottom: 0.3em; margin: 1.1em 0 0.5em; }
    .preview-content h3 { font-size: 1.18em; margin: 1.1em 0 0.4em; }
    .preview-content p { margin: 0.6em 0; line-height: 1.75; }
    .preview-content code { background: var(--color-bg-secondary); padding: 0.2em 0.4em; border-radius: 3px; font-size: 0.9em; }
    .preview-content pre { background: var(--color-bg-secondary); padding: 1em; border-radius: var(--radius-md); overflow-x: auto; border: 1px solid var(--color-border); }
    .preview-content blockquote { border-left: 3px solid var(--color-border); padding-left: 1em; margin: 0.75em 0; color: var(--color-text-secondary); }
    .preview-content ul, .preview-content ol { margin: 0.6em 0; padding-left: 2em; }
    .preview-content li { margin: 0.35em 0; }
    .preview-content table { border-collapse: collapse; width: 100%; margin: 0.75em 0; }
    .preview-content th, .preview-content td { border: 1px solid var(--color-border); padding: 8px 12px; }
    .preview-content th { background: var(--color-bg-secondary); text-align: left; }
    .preview-content img { max-width: 100%; height: auto; border-radius: var(--radius-md); }
    .preview-content input[type="checkbox"] { margin-right: 6px; }

    /* 欢迎页 */
    .welcome-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
    }
    .welcome-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 32px;
      max-width: 560px;
      width: 100%;
    }
    .welcome-logo {
      width: 72px; height: 72px; margin-bottom: 20px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
    }
    .welcome-title { font-size: 30px; font-weight: 700; color: var(--color-text); margin: 0; letter-spacing: -0.02em; }
    .welcome-subtitle { font-size: 14px; color: var(--color-text-secondary); margin: 10px 0 36px; }
    .welcome-actions { display: flex; gap: 12px; margin-bottom: 44px; }
    .welcome-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 22px; font-size: 13px; font-weight: 500;
      border: 1px solid var(--color-border); border-radius: var(--radius-lg);
      background: var(--color-bg-primary); color: var(--color-text);
      cursor: pointer; transition: all var(--transition-normal);
      box-shadow: var(--shadow-xs);
    }
    .welcome-btn:hover {
      border-color: var(--color-primary); color: var(--color-primary);
      background: var(--color-primary-soft);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }
    .welcome-btn.primary {
      background: var(--color-primary); border-color: var(--color-primary);
      color: white; box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }
    .welcome-btn.primary:hover {
      background: var(--color-primary-hover);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    .welcome-btn svg { width: 16px; height: 16px; }
    .shortcuts-title {
      font-size: 12px; font-weight: 600; color: var(--color-text-tertiary);
      text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 16px;
    }
    .shortcuts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 36px; }
    .shortcut-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
    .shortcut-item kbd {
      display: inline-flex; align-items: center; padding: 3px 9px;
      font-family: var(--font-mono); font-size: 11px;
      background: var(--color-bg-secondary); border: 1px solid var(--color-border);
      border-bottom-width: 2px; border-radius: 5px;
      color: var(--color-text-secondary); white-space: nowrap;
    }
    .shortcut-item span { font-size: 13px; color: var(--color-text-secondary); }

    /* 标签右键菜单 */
    .tab-context-menu {
      position: fixed; z-index: 10001; min-width: 170px; padding: 5px;
      background: var(--color-bg-primary); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
      display: none;
    }
    .tab-context-menu.visible { display: block; }
    .tab-context-menu .context-menu-item {
      padding: 7px 14px; font-size: 13px; color: var(--color-text);
      border-radius: var(--radius-md); cursor: pointer; white-space: nowrap;
      transition: background var(--transition-fast);
    }
    .tab-context-menu .context-menu-item:hover { background: var(--color-bg-secondary); }
  </style>
</head>
<body>
  <div class="editor-panel">
    <!-- TabBar -->
    <div class="tab-bar" id="tab-bar">
      <!-- 标签由 JS 渲染 -->
    </div>

    <!-- 编辑器区域 -->
    <div class="editor-area" id="editor-area">
      <!-- IR 面板 -->
      <div class="ir-panel" id="ir-panel"></div>

      <!-- 源码面板 -->
      <div class="source-panel" id="source-panel" style="display:none"></div>

      <!-- 分屏布局 -->
      <div class="split-layout" id="split-layout" style="display:none"></div>

      <!-- 欢迎页（无文件时显示） -->
      <div class="welcome-page" id="welcome-page" style="display:none"></div>
    </div>

    <!-- 标签右键菜单 -->
    <div class="tab-context-menu" id="tab-context-menu"></div>
  </div>

  <script src="../js/theme-bridge.js"></script>
  <script>
    (function () {
      var mode = 'ir'; // ir | source | split
      var tabs = [
        { id: 't1', name: '示例文档.mdx', active: true, modified: true },
        { id: 't2', name: '项目说明.mdx', active: false, modified: false },
        { id: 't3', name: '会议纪要.mdx', active: false, modified: false }
      ];

      var tabBar = document.getElementById('tab-bar');
      var tabContextMenu = document.getElementById('tab-context-menu');

      // 示例 Markdown
      var sampleMd = [
        '# Markdown+ 编辑器介绍',
        '',
        '欢迎使用 **Markdown+** 编辑器！这是一款支持自定义 `.mdx` 文件格式的 Markdown 编辑器。',
        '',
        '## 主要特性',
        '',
        '### 自包含文件格式',
        '',
        '`.mdx` 文件采用 ZIP 压缩格式，内部包含 Markdown 内容、图片资源和元数据配置。',
        '',
        '- 支持拖拽上传图片',
        '- 支持复制粘贴图片',
        '- 支持文件选择插入',
        '',
        '## 代码示例',
        '',
        '```javascript',
        'function hello() {',
        '  console.log("Hello, Markdown+!");',
        '}',
        '```',
        '',
        '## 表格示例',
        '',
        '| 功能 | 状态 | 备注 |',
        '|------|------|------|',
        '| 文件操作 | 已完成 | 首批功能 |',
        '| 图片管理 | 已完成 | 首批功能 |',
        '| 实时预览 | 已完成 | 首批功能 |',
        '',
        '## 待办事项',
        '',
        '- [x] 创建需求文档',
        '- [x] 设计文件格式',
        '- [ ] 实现编辑器核心功能',
        '',
        '> **提示**: 这是一个原型演示。',
        '',
        '---'
      ].join('\n');

      // ===== Tab 渲染 =====
      function renderTabs() {
        tabBar.innerHTML = tabs.map(function (tab) {
          return '<div class="tab' + (tab.active ? ' active' : '') + '" data-id="' + tab.id + '">' +
            '<svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>' +
            '<span class="tab-label">' + tab.name + '</span>' +
            (tab.modified ? '<span class="tab-modified-dot"></span>' : '') +
            '<button class="tab-close-btn" data-id="' + tab.id + '"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>' +
            '</div>';
        }).join('');

        tabBar.querySelectorAll('.tab').forEach(function (el) {
          el.addEventListener('click', function () {
            var id = el.getAttribute('data-id');
            tabs.forEach(function (t) { t.active = (t.id === id); });
            renderTabs();
          });
          el.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            e.stopPropagation();
            showTabMenu(e.clientX, e.clientY);
          });
        });

        tabBar.querySelectorAll('.tab-close-btn').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var id = btn.getAttribute('data-id');
            closeTab(id);
          });
        });
      }

      function closeTab(id) {
        var idx = tabs.findIndex(function (t) { return t.id === id; });
        if (idx === -1) return;
        var wasActive = tabs[idx].active;
        tabs.splice(idx, 1);
        if (tabs.length === 0) { showWelcome(); return; }
        if (wasActive) {
          var next = tabs[Math.min(idx, tabs.length - 1)];
          next.active = true;
        }
        renderTabs();
      }

      function showTabMenu(x, y) {
        var items = ['导出 PDF', '关闭', '关闭其他', '关闭全部', '打开文件所在位置'];
        tabContextMenu.innerHTML = items.map(function (label) {
          return '<div class="context-menu-item">' + label + '</div>';
        }).join('');
        tabContextMenu.style.left = x + 'px';
        tabContextMenu.style.top = y + 'px';
        tabContextMenu.classList.add('visible');
        tabContextMenu.querySelectorAll('.context-menu-item').forEach(function (item) {
          item.addEventListener('click', function () {
            tabContextMenu.classList.remove('visible');
            if (item.textContent === '关闭全部') { tabs = []; showWelcome(); }
            else if (item.textContent === '关闭') { closeTab(tabs.find(function (t) { return t.active; }).id); }
          });
        });
      }

      // ===== IR 渲染（静态 HTML 模拟） =====
      function renderIr() {
        var panel = document.getElementById('ir-panel');
        panel.innerHTML =
          '<div class="ir-content">' +
          '<h1>Markdown+ 编辑器介绍</h1>' +
          '<p>欢迎使用 <span class="md-mark md-bold">Markdown+</span> 编辑器！这是一款支持自定义 <span class="md-mark md-code">.mdx</span> 文件格式的 Markdown 编辑器。</p>' +
          '<h2>主要特性</h2>' +
          '<h3>自包含文件格式</h3>' +
          '<p><span class="md-mark md-code">.mdx</span> 文件采用 ZIP 压缩格式，内部包含 Markdown 内容、图片资源和元数据配置。</p>' +
          '<ul>' +
          '<li>支持拖拽上传图片</li>' +
          '<li>支持复制粘贴图片</li>' +
          '<li>支持文件选择插入</li>' +
          '</ul>' +
          '<h2>代码示例</h2>' +
          '<pre data-lang="javascript">function hello() {\n  console.log("Hello, Markdown+!");\n}</pre>' +
          '<h2>表格示例</h2>' +
          '<table>' +
          '<tr><th>功能</th><th>状态</th><th>备注</th></tr>' +
          '<tr><td>文件操作</td><td>已完成</td><td>首批功能</td></tr>' +
          '<tr><td>图片管理</td><td>已完成</td><td>首批功能</td></tr>' +
          '<tr><td>实时预览</td><td>已完成</td><td>首批功能</td></tr>' +
          '</table>' +
          '<h2>待办事项</h2>' +
          '<ul class="task-list">' +
          '<li class="checked"><input type="checkbox" checked> 创建需求文档</li>' +
          '<li class="checked"><input type="checkbox" checked> 设计文件格式</li>' +
          '<li><input type="checkbox"> 实现编辑器核心功能</li>' +
          '</ul>' +
          '<blockquote><span class="md-mark md-bold">提示</span>: 这是一个原型演示。</blockquote>' +
          '<hr>' +
          '</div>';
      }

      // ===== 源码渲染 =====
      function renderSource() {
        var lines = sampleMd.split('\n');
        var nums = lines.map(function (_, i) { return '<div>' + (i + 1) + '</div>'; }).join('');
        var code = lines.map(function (line) {
          var cls = '';
          if (/^#\s/.test(line)) cls = 'md-h';
          return line;
        }).join('\n');
        document.getElementById('source-panel').innerHTML =
          '<div class="source-code">' +
          '<div class="line-numbers">' + nums + '</div>' +
          '<div class="code-text">' + escapeHtml(code) + '</div>' +
          '</div>';
      }

      // ===== 预览渲染 =====
      function renderPreview() {
        var el = document.getElementById('split-layout');
        el.innerHTML =
          '<div class="split-source" id="split-source"></div>' +
          '<div class="split-preview"><div class="preview-content" id="preview-content"></div></div>';
        // 源码侧
        var lines = sampleMd.split('\n');
        var nums = lines.map(function (_, i) { return '<div>' + (i + 1) + '</div>'; }).join('');
        document.getElementById('split-source').innerHTML =
          '<div class="source-code"><div class="line-numbers">' + nums + '</div><div class="code-text">' + escapeHtml(sampleMd) + '</div></div>';
        // 预览侧
        document.getElementById('preview-content').innerHTML =
          '<h1>Markdown+ 编辑器介绍</h1>' +
          '<p>欢迎使用 <strong>Markdown+</strong> 编辑器！这是一款支持自定义 <code>.mdx</code> 文件格式的 Markdown 编辑器。</p>' +
          '<h2>主要特性</h2>' +
          '<h3>自包含文件格式</h3>' +
          '<p><code>.mdx</code> 文件采用 ZIP 压缩格式，内部包含 Markdown 内容、图片资源和元数据配置。</p>' +
          '<ul><li>支持拖拽上传图片</li><li>支持复制粘贴图片</li><li>支持文件选择插入</li></ul>' +
          '<h2>代码示例</h2>' +
          '<pre><code>function hello() {\n  console.log("Hello, Markdown+!");\n}</code></pre>' +
          '<h2>表格示例</h2>' +
          '<table><tr><th>功能</th><th>状态</th><th>备注</th></tr>' +
          '<tr><td>文件操作</td><td>已完成</td><td>首批功能</td></tr>' +
          '<tr><td>图片管理</td><td>已完成</td><td>首批功能</td></tr>' +
          '<tr><td>实时预览</td><td>已完成</td><td>首批功能</td></tr></table>' +
          '<h2>待办事项</h2>' +
          '<ul><li><input type="checkbox" checked> 创建需求文档</li><li><input type="checkbox" checked> 设计文件格式</li><li><input type="checkbox"> 实现编辑器核心功能</li></ul>' +
          '<blockquote><strong>提示</strong>: 这是一个原型演示。</blockquote>' +
          '<hr>';
      }

      // ===== 欢迎页 =====
      function renderWelcome() {
        document.getElementById('welcome-page').innerHTML =
          '<div class="welcome-content">' +
          '<img src="../assets/logo.svg" alt="M+" class="welcome-logo">' +
          '<h1 class="welcome-title">Markdown+</h1>' +
          '<p class="welcome-subtitle">轻量级 Markdown 编辑器</p>' +
          '<div class="welcome-actions">' +
          '<button class="welcome-btn primary">新建文件</button>' +
          '<button class="welcome-btn">打开文件</button>' +
          '<button class="welcome-btn">打开文件夹</button>' +
          '</div>' +
          '<div class="welcome-shortcuts">' +
          '<h2 class="shortcuts-title">快捷键</h2>' +
          '<div class="shortcuts-grid">' +
          shortcut('Ctrl+N', '新建文件') + shortcut('Ctrl+O', '打开文件') +
          shortcut('Ctrl+S', '保存文件') + shortcut('Ctrl+Shift+S', '另存为') +
          shortcut('Ctrl+B', '粗体') + shortcut('Ctrl+I', '斜体') +
          shortcut('Ctrl+K', '插入链接') + shortcut('Ctrl+H', '切换标题') +
          shortcut('Ctrl+F', '查找') + shortcut('Ctrl+/', '注释') +
          '</div></div></div>';
      }

      function shortcut(kbd, label) {
        return '<div class="shortcut-item"><kbd>' + kbd + '</kbd><span>' + label + '</span></div>';
      }

      // ===== 模式切换 =====
      function applyMode(m) {
        mode = m;
        var ir = document.getElementById('ir-panel');
        var src = document.getElementById('source-panel');
        var split = document.getElementById('split-layout');
        ir.style.display = 'none';
        src.style.display = 'none';
        split.style.display = 'none';
        if (mode === 'ir') {
          ir.style.display = 'block';
          renderIr();
        } else if (mode === 'source') {
          src.style.display = 'block';
          renderSource();
        } else if (mode === 'split') {
          split.style.display = 'flex';
          renderPreview();
        }
      }

      function showWelcome() {
        ['ir-panel', 'source-panel', 'split-layout'].forEach(function (id) {
          document.getElementById(id).style.display = 'none';
        });
        document.getElementById('welcome-page').style.display = 'flex';
        renderWelcome();
      }

      function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // 监听 parent 广播的模式切换
      window.addEventListener('proto:mode', function (e) {
        applyMode(e.detail);
      });

      // 初始化
      renderTabs();
      applyMode('ir');

      // 全局点击关闭 tab 菜单
      document.addEventListener('click', function () {
        tabContextMenu.classList.remove('visible');
      });

      // 暴露模式切换给欢迎页按钮（模拟：点「新建文件」回到编辑器）
      document.getElementById('welcome-page').addEventListener('click', function (e) {
        if (e.target.classList.contains('welcome-btn')) {
          tabs = [{ id: 't1', name: '未命名.mdx', active: true, modified: false }];
          document.getElementById('welcome-page').style.display = 'none';
          renderTabs();
          applyMode('ir');
        }
      });
    })();
  </script>
</body>
</html>
