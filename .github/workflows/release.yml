name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            build_cmd: npm run build:win:ci
            artifact_glob: |
              dist/*.exe
              dist/*.zip
              dist/latest*.yml
              dist/*.blockmap
          - os: ubuntu-latest
            name: linux
            build_cmd: npm run build:linux:ci
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb
              dist/latest*.yml
              dist/*.blockmap
          # macOS release packaging can be enabled later when signing/notarization is ready.
          # - os: macos-latest
          #   name: macos
          #   build_cmd: npm run build:mac:ci
          #   artifact_glob: |
          #     dist/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Sync version from tag
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.version = process.env.GITHUB_REF_NAME.replace(/^v/, '')
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: ${{ matrix.build_cmd }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-release
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -maxdepth 3 -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          {
            echo '## Release published successfully'
            echo ''
            echo "Tag: ${{ github.ref_name }}"
            echo 'Assets uploaded from the `dist/` directory.'
          } >> "$GITHUB_STEP_SUMMARY"
